services:
  - type: web
    name: motoja-sp
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: STORAGE
        value: sqlite
      - key: SQLITE_FILE
        value: /app/data/motoja.sqlite3
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
    disk:
      name: motoja-data
      mountPath: /app/data
      sizeGB: 1
