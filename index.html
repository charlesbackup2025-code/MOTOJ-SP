<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><title>MOTOJASP — mobilidade urbana</title>
</head>
<body>
<header class="site-header"><a class="brand" href="#inicio"><b>MJ</b><strong>MOTOJASP</strong></a><a class="demo-link" href="#buscar">Aplicativo demonstrativo</a></header>
<main id="inicio" class="phone-app">
<section class="home-screen" id="buscar"><div class="hello"><span>Olá, Thanos</span><button class="avatar" id="profileBtn">T</button></div>
<button class="search-trigger" id="searchTrigger"><span>⌕</span><strong>Para onde você vai?</strong><small>Digite o endereço de embarque<br>Digite o endereço de destino</small></button>
<div class="quick-destinations"><button data-destination="Centro">Centro</button><button data-destination="Paulista">Paulista</button></div><div class="demo-map" aria-label="Mapa demonstrativo com rota"><div class="map-road road-a"></div><div class="map-road road-b"></div><div class="map-road road-c"></div><div class="map-route"></div><span class="map-pin pin-origin">●</span><span class="map-pin pin-destination">●</span><span class="map-label label-origin">Embarque</span><span class="map-label label-destination">Destino</span></div>
<div id="searchBox" class="search-box hidden"><label>EMBARQUE:<input id="origin" placeholder="Digite o endereço de embarque"></label><label>DESTINO:<input id="destination" placeholder="Digite o endereço de destino"></label><button id="useGps" class="outline">Usar minha localização</button></div>
<div id="rideChooser"><div class="section-label">MODALIDADES</div><div class="ride-options">
<button class="ride-option active" data-type="moto"><span class="ride-icon">🏍️</span><span><b>MOTO</b><small>Chega em 3 min · 1 passageiro</small></span><strong>R$ 8,00<small>estimado</small></strong></button>
<button class="ride-option" data-type="motoX"><span class="ride-icon">🏍️</span><span><b>MOTO X</b><small>Chega em 4 min · mínimo 1–2 km</small></span><strong>R$ 12,00<small>estimado</small></strong></button>
<button class="ride-option" data-type="negotiate"><span class="ride-icon">🏍️</span><span><b>MOTO NEGOCIA</b><small>Mínimo 1–3 km · + R$ 2,50/km adicional</small></span><strong>R$ 18,00<small>base</small></strong></button>
<button class="ride-option" data-type="delivery"><span class="ride-icon">🛵</span><span><b>ENTREGA MOTO</b><small>+ R$ 2,00 por km adicional</small></span><strong>R$ 8,00<small>base estimada</small></strong></button></div><button id="requestRide" class="request-btn">Buscar corrida</button></div>
<div id="activeRide" class="hidden"></div><nav class="bottom-nav"><a class="active" href="#inicio">⌂<small>INÍCIO</small></a><a href="#carteira">◈<small>CARTEIRA</small></a><a href="#perfil">?<small>AJUDA</small></a></nav></section>
</main><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
